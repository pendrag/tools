<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySQL to PostgreSQL Converter</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
        }
        #outputSQL {
            height: 300px;
            background-color: #f5f5f5;
        }
        .input-group {
            margin-bottom: 15px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #apiKeyInput {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .warning {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }
        .info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .author {
            font-size: 14px;
            color: #7f8c8d;
            margin-top: 5px;
            text-align: center;
        } 
        #statusMessages {
            margin-top: 20px;
            height: 100px;
            overflow-y: auto;
            padding: 10px;
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
        }
        .hidden {
            display: none;
        }
        .controls {
            display: flex;
            gap: 10px;
        }
        footer {
            margin-top: 40px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }
        #downloadButton {
            background-color: #007bff;
        }
        #downloadButton:hover {
            background-color: #0069d9;
        }
        #clearButton {
            background-color: #6c757d;
        }
        #clearButton:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>
    <h1>MySQL to PostgreSQL Converter</h1>
    <div class="author">By pendrag</div>
    <div class="container">

        
        <div class="card">
            <div class="input-group">
                <label for="inputSQL">MySQL SQL Input</label>
                <textarea id="inputSQL" placeholder="Paste your MySQL SQL statements here"></textarea>
            </div>
            
            <div class="controls">
                <button id="convertButton">Convert to PostgreSQL</button>
                <button id="clearButton">Clear</button>
            </div>
        </div>
        
        <div id="statusMessages" class="hidden"></div>
        
        <div class="card">
            <div class="input-group">
                <label for="outputSQL">PostgreSQL SQL Output</label>
                <textarea id="outputSQL" readonly placeholder="PostgreSQL conversion will appear here"></textarea>
            </div>
            
            <button id="downloadButton" disabled>Download PostgreSQL SQL</button>
        </div>
    </div>
    
    <footer>
        <p>This tool converts MySQL SQL statements to PostgreSQL format using the Gemini API.</p>
        <p>All processing happens in your browser - no data is sent to any server except to the Gemini API for conversion.</p>
    </footer>

    <script>
        // Configuration
        const CONFIG = {
            GEMINI_MODEL: "gemini-2.0-flash",
            API_ENDPOINT: "https://generativelanguage.googleapis.com/v1beta/models/",
            MAX_CHUNK_SIZE: 30000,
            MAX_RETRIES: 3,
            RETRY_DELAY: 1000,
        };

        // DOM Elements
        const inputSQL = document.getElementById('inputSQL');
        const outputSQL = document.getElementById('outputSQL');
        const convertButton = document.getElementById('convertButton');
        const downloadButton = document.getElementById('downloadButton');
        const clearButton = document.getElementById('clearButton');
        const statusMessages = document.getElementById('statusMessages');

        // Event Listeners
        convertButton.addEventListener('click', handleConvert);
        downloadButton.addEventListener('click', handleDownload);
        clearButton.addEventListener('click', handleClear);

        // Main conversion handler
        async function handleConvert() {
            // Reset UI
            outputSQL.value = '';
            downloadButton.disabled = true;
            statusMessages.classList.remove('hidden');
            statusMessages.innerHTML = '';
            
            // Get and validate API key
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                showStatus('Please enter your Gemini API key.', 'error');
                return;
            }
            
            // Save API key (if user wants)
            if (confirm('Would you like to save your API key in browser storage for future use?')) {
                localStorage.setItem('geminiApiKey', apiKey);
            }
            
            // Get and validate SQL input
            const sqlContent = inputSQL.value.trim();
            if (!sqlContent) {
                showStatus('Please enter some MySQL SQL statements.', 'error');
                return;
            }
            
            try {
                // Disable convert button
                convertButton.disabled = true;
                
                // Log status
                showStatus(`Processing ${sqlContent.length} characters of SQL...`, 'info');
                
                // Process the SQL in chunks if needed
                const chunks = splitIntoChunks(sqlContent, CONFIG.MAX_CHUNK_SIZE);
                showStatus(`Split into ${chunks.length} chunks for processing`, 'info');
                
                // Convert each chunk and collect results
                let convertedChunks = [];
                let chunkNumber = 1;
                
                for (const chunk of chunks) {
                    showStatus(`Converting chunk ${chunkNumber}/${chunks.length}...`, 'info');
                    
                    try {
                        const convertedChunk = await convertSqlChunk(chunk, chunkNumber, chunks.length, apiKey);
                        convertedChunks.push(convertedChunk);
                        showStatus(`Chunk ${chunkNumber}/${chunks.length} converted successfully.`, 'success');
                    } catch (error) {
                        showStatus(`Error converting chunk ${chunkNumber}: ${error.message}`, 'error');
                        throw error;
                    }
                    
                    chunkNumber++;
                }
                
                // Combine all converted chunks
                const convertedSQL = convertedChunks.join('\n\n');
                
                // Update UI with result
                outputSQL.value = convertedSQL;
                downloadButton.disabled = false;
                
                showStatus('Conversion completed successfully!', 'success');
                
            } catch (error) {
                showStatus(`Conversion failed: ${error.message}`, 'error');
            } finally {
                // Re-enable convert button
                convertButton.disabled = false;
            }
        }

        // Function to split content into chunks
        function splitIntoChunks(content, maxChunkSize) {
            const chunks = [];
            
            // If content is small enough, return as a single chunk
            if (content.length <= maxChunkSize) {
                return [content];
            }
            
            // Try to split at statement boundaries (semicolons followed by newlines)
            let startPos = 0;
            let currentPos = 0;
            let lastSafeBreakPos = 0;
            
            while (currentPos < content.length) {
                // Look for statement boundaries (semicolon followed by newline)
                if (content[currentPos] === ';' && 
                    (currentPos + 1 < content.length && 
                    (content[currentPos + 1] === '\n' || content[currentPos + 1] === '\r'))) {
                    lastSafeBreakPos = currentPos + 1;
                }
                
                // If we've accumulated enough text or reached the end
                if (currentPos - startPos >= maxChunkSize || currentPos === content.length - 1) {
                    // If we found a safe break point, use it
                    if (lastSafeBreakPos > startPos) {
                        chunks.push(content.substring(startPos, lastSafeBreakPos));
                        startPos = lastSafeBreakPos;
                        currentPos = lastSafeBreakPos;
                    } else {
                        // If no safe break point, just break at max size
                        chunks.push(content.substring(startPos, currentPos));
                        startPos = currentPos;
                    }
                    lastSafeBreakPos = startPos;
                } else {
                    currentPos++;
                }
            }
            
            // Add any remaining content
            if (startPos < content.length) {
                chunks.push(content.substring(startPos));
            }
            
            return chunks;
        }

        // Convert a chunk of SQL using Gemini API
        async function convertSqlChunk(sqlChunk, chunkNumber, totalChunks, apiKey) {
            let retries = 0;
            
            while (retries < CONFIG.MAX_RETRIES) {
                try {
                    const promptContent = createPrompt(sqlChunk, chunkNumber, totalChunks);
                    const response = await callGeminiAPI(promptContent, apiKey);
                    
                    // Extract the converted SQL from the response
                    const convertedSQL = extractConvertedSQL(response);
                    return convertedSQL;
                    
                } catch (error) {
                    retries++;
                    if (retries >= CONFIG.MAX_RETRIES) {
                        throw error;
                    }
                    showStatus(`API call failed. Retrying (${retries}/${CONFIG.MAX_RETRIES})...`, 'warning');
                    await delay(CONFIG.RETRY_DELAY);
                }
            }
        }

        // Create the prompt for Gemini
        function createPrompt(sqlChunk, chunkNumber, totalChunks) {
            return {
                contents: [
                    {
                        parts: [
                            {
                                text: `You are an expert SQL converter that specializes in converting MySQL syntax to PostgreSQL syntax. 
                                
I'll provide you with a chunk of MySQL SQL code (chunk ${chunkNumber} of ${totalChunks}). 
Please convert it to PostgreSQL syntax following these rules:

1. Handle data type differences (e.g., INT to INTEGER, TINYINT(1) to BOOLEAN, etc.)
2. Change AUTO_INCREMENT to SERIAL or BIGSERIAL as appropriate
3. Replace backticks with double quotes for identifiers
4. Convert ENGINE=InnoDB and other MySQL-specific table options to PostgreSQL syntax
5. Update function calls with PostgreSQL equivalents (e.g., NOW() remains, but IFNULL() becomes COALESCE())
6. Handle DEFAULT and ON UPDATE CURRENT_TIMESTAMP differences
7. Convert any MySQL-specific SQL statements to their PostgreSQL equivalents

Only return the converted SQL code, without any explanations, comments or markdown formatting. Return the complete SQL with all statements intact, just converted to PostgreSQL syntax.

Here's the MySQL code to convert:

${sqlChunk}`
                            }
                        ]
                    }
                ]
            };
        }

        // Call Gemini API
        async function callGeminiAPI(requestBody) {
            const url = '/.netlify/functions/gemini-proxy'; // Your function endpoint
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: CONFIG.GEMINI_MODEL,
                        content: requestBody.contents[0].parts[0].text
                    })
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`API request failed with status ${response.status}: ${errorText}`);
                }
                
                return await response.json();
                
            } catch (error) {
                throw new Error(`API request failed: ${error.message}`);
            }
        }

        // Extract the converted SQL from the Gemini API response
        function extractConvertedSQL(response) {
            try {
                if (response && 
                    response.candidates && 
                    response.candidates[0] && 
                    response.candidates[0].content &&
                    response.candidates[0].content.parts &&
                    response.candidates[0].content.parts[0] &&
                    response.candidates[0].content.parts[0].text) {
                    return response.candidates[0].content.parts[0].text.trim();
                } else {
                    throw new Error("Unexpected API response format");
                }
            } catch (error) {
                throw new Error(`Failed to extract SQL from response: ${error.message}`);
            }
        }

        // Download the converted SQL
        function handleDownload() {
            const convertedSQL = outputSQL.value;
            if (!convertedSQL) return;
            
            const blob = new Blob([convertedSQL], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'converted_postgresql.sql';
            document.body.appendChild(a);
            a.click();
            
            // Cleanup
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 0);
        }

        // Clear all fields
        function handleClear() {
            inputSQL.value = '';
            outputSQL.value = '';
            statusMessages.innerHTML = '';
            statusMessages.classList.add('hidden');
            downloadButton.disabled = true;
        }

        // Show status message
        function showStatus(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const statusElement = document.createElement('div');
            statusElement.className = type;
            statusElement.textContent = `[${timestamp}] ${message}`;
            
            // Add to status messages
            statusMessages.appendChild(statusElement);
            statusMessages.scrollTop = statusMessages.scrollHeight;
        }

        // Helper function to create a delay
        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
    </script>
</body>
</html>
